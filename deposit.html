<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="예금과 적금을 유지할지 갈아탈지 비교해보세요. 중도해지 손실과 새 상품의 예상 이자를 함께 계산할 수 있습니다.">
    <title>예금셈 | 셈결정</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div id="header"></div>

<main class="category-page">
    <section class="category-head">
        <p class="calculator-category">예금셈</p>
        <h1>예금·적금 계산을 한눈에</h1>
        <p>예금과 적금을 유지할지, 갈아탈지 필요한 계산을 빠르게 비교해보세요.</p>
    </section>

    <section class="category-grid">
        <a href="./calculators/deposit-switch.html" class="calc-card">
            <div class="card-icon">
                <img src="./images/deposit-switch.png" alt="예금 갈아타기">
            </div>
            <h3>예금 갈아타기</h3>
            <p>예금을 깨고 옮기는 게<br>정말 이득일까요?</p>
            <span class="card-link">계산하기 →</span>
        </a>

        <a href="./calculators/savings-switch.html" class="calc-card">
            <div class="card-icon">
                <img src="./images/savings-switch.png" alt="적금 갈아타기">
            </div>
            <h3>적금 갈아타기</h3>
            <p>지금 적금을 깨고<br>새 적금으로 옮길까요?</p>
            <span class="card-link">계산하기 →</span>
        </a>
    </section>
</main>

<div id="footer"></div>

<script src="./js/common.js"></script>
</body>
</html>
