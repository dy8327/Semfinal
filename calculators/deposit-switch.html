<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
    <meta name="description" content="현재 예금을 중도해지하고 새 예금으로 갈아타는 것이 유리한지 계산합니다. 중도해지 이자와 새 금리를 같은 기간 기준으로 비교해보세요.">
    <title>예금 갈아타기 계산기 | 셈결정</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
<div id="header"></div>

<main class="calculator-page">

    <section class="calculator-head">
        <div>
            <p class="calculator-category">
                예금 계산기
            </p>
            <h1>
                예금 갈아타기 계산기
            </h1>
            <p class="calculator-description">
                기존 예금을 중도해지하고
                더 높은 금리 상품으로 갈아타는 것이
                실제로 유리한지 계산합니다.
            </p>
        </div>

        <img src="../images/deposit-switch.png" alt="예금 갈아타기 계산기" class="calculator-head-image">

    </section>

    <section class="calculator-box">
        <div class="calculator-form">
            <div class="input-group">
                <label for="depositAmount">
                    현재 예치금액
                </label>
                <div class="input-unit">
                    <input type="text" id="depositAmount" inputmode="numeric" placeholder="예: 50,000,000">
                    <span>원</span>
                </div>

                <div class="money-korean" id="depositAmountKorean">
                </div>

            </div>

            <div class="input-group">
                <label for="currentRate">
                    현재 예금 금리
                </label>
                <div class="input-unit">
                    <input type="number" id="currentRate" step="0.01" placeholder="예: 3.2">
                    <span>%</span>
                </div>

            </div>

            <div class="input-group">
                <label for="totalMonths">현재 예금 약정기간</label>
                <div class="input-unit">
                    <input type="number" id="totalMonths" placeholder="가입할 때 정한 예금 전체 기간을 입력하세요. 예: 12">
                    <span>개월</span>
                </div>
            </div>

            <div class="input-group">
                <label for="elapsedMonths">현재까지 예치한 기간</label>
                <div class="input-unit">
                    <input type="number" id="elapsedMonths" placeholder="예: 5">
                    <span>개월</span>
                </div>
            </div>

            <div class="input-group">
                <label for="earlyTerminationRate">
                    중도해지 적용 예상 금리
                </label>
                <div class="input-unit">
                    <input type="number" id="earlyTerminationRate" step="0.01" placeholder="예: 1.0">
                    <span>%</span>
                </div>

            </div>


            <div class="input-group">
                <label for="newRate">
                    새 예금 금리
                </label>
                <div class="input-unit">
                    <input type="number" id="newRate" step="0.01" placeholder="예: 4.0">
                    <span>%</span>
                </div>

            </div>

            <div class="input-group">
                <label for="newMonths">
                    새 예금 가입기간
                </label>
                <div class="input-unit">
                    <input type="number" id="newMonths" placeholder="예: 12">
                    <span>개월</span>
                </div>

            </div>

            <button type="button" class="calculate-button" id="calculateButton">
                계산하기
            </button>

        </div>

        <div class="calculator-result" id="resultBox">
            <div class="result-empty">
                값을 입력하고 계산하기를 눌러주세요.
            </div>
        </div>

    </section>

</main>
<div id="footer"></div>
<script src="../js/deposit-switch.js"></script>
<script src="../js/common.js"></script>
</body>
</html>
