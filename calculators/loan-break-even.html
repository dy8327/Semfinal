<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="중도상환수수료를 내고 지금 대출을 갚는 것이 유리한지 계산합니다. 예상 이자 절감액과 수수료 회수기간을 비교해보세요.">
    <title>중도상환 손익 계산기 | 셈결정</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div id="header"></div>

<main class="calculator-page">

    <section class="calculator-head">
        <div>
            <p class="calculator-category">
                대출 계산기
            </p>
            <h1>
                중도상환 손익 계산기
            </h1>
            <p class="calculator-description">
                중도상환수수료를 내더라도
                지금 대출을 갚는 것이 유리한지 계산합니다.
            </p>
        </div>

        <img src="../images/loan-break-even.png" alt="중도상환 손익 계산기" class="calculator-head-image">

    </section>

    <section class="calculator-box">
        <div class="calculator-form">
            <div class="input-group">
                <label for="loanAmount">
                    남은 대출원금
                </label>
                <div class="input-unit">
                    <input type="text" id="loanAmount" inputmode="numeric" placeholder="예: 150,000,000">
                    <span>원</span>
                </div>
                <div class="money-korean" id="loanAmountKorean">
                </div>
            </div>

            <div class="input-group">
                <label for="interestRate">
                    연 이자율
                </label>
                <div class="input-unit">
                    <input type="number" id="interestRate" step="0.01" placeholder="예: 4.2">
                    <span>%</span>
                </div>
            </div>

            <div class="input-group">
                <label for="remainingMonths">
                    남은 대출기간
                </label>

                <div class="input-unit">
                    <input type="number" id="remainingMonths" placeholder="예: 60">
                    <span>개월</span>
                </div>
            </div>

            <div class="input-group">
                <label for="repaymentType">
                    상환 방식
                </label>
                <select id="repaymentType">
                    <option value="equal-payment">
                        원리금균등상환
                    </option>
                    <option value="equal-principal">
                        원금균등상환
                    </option>
                    <option value="bullet">
                        만기일시상환
                    </option>
                </select>
            </div>

            <div class="input-group">
                <label for="prepaymentAmount">
                    지금 갚을 금액
                </label>
                <div class="input-unit">
                    <input type="text" id="prepaymentAmount" inputmode="numeric" placeholder="예: 30,000,000">
                    <span>원</span>
                </div>
                <div class="money-korean" id="prepaymentAmountKorean">
                </div>
            </div>

            <div class="input-group">
                <label for="feeRate">
                    중도상환수수료율
                </label>
                <div class="input-unit">
                    <input type="number" id="feeRate" step="0.01" value="0">
                    <span>%</span>
                </div>
            </div>

            <button type="button" class="calculate-button" id="calculateButton">
                계산하기
            </button>

        </div>
        <div class="calculator-result" id="resultBox">
            <div class="result-empty">
                값을 입력하고 계산하기를 눌러주세요.
            </div>

        </div>

    </section>

</main>

<div id="footer"></div>
<script src="../js/loan-break-even.js"></script>
<script src="../js/common.js"></script>
</body>
</html>
