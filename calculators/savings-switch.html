<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>적금 갈아타기 계산기 | 셈결정</title>
    <meta name="description" content="현재 적금을 중도해지하고 새 적금으로 갈아타는 것이 유리한지 계산합니다. 중도해지 이자와 새 적금의 예상 이자를 비교해보세요.">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="header"></div>

<main class="calculator-page">
    <section class="calculator-head">
        <div>
            <p class="calculator-category">적금 계산기</p>
            <h1>적금 갈아타기 계산기</h1>
            <p class="calculator-description">
                현재 적금을 중도해지하고 새 적금으로 갈아타는 것이 유리한지 비교합니다.
            </p>
        </div>
        <img src="../images/savings-switch.png" alt="적금 갈아타기 계산기" class="calculator-head-image">
    </section>

    <section class="calculator-box">
        <div class="calculator-form">

            <div class="input-group">
                <label for="currentMonthlyAmount">현재 적금 월 납입액</label>
                <div class="input-unit">
                    <input type="text" id="currentMonthlyAmount" inputmode="numeric" placeholder="예: 500,000">
                    <span>원</span>
                </div>
                <div class="money-korean" id="currentMonthlyAmountKorean"></div>
            </div>

            <div class="input-group">
                <label for="currentRate">현재 적금 금리</label>
                <div class="input-unit">
                    <input type="number" id="currentRate" step="0.01" placeholder="예: 4.0">
                    <span>%</span>
                </div>
            </div>

            <div class="input-group">
                <label for="totalMonths">현재 적금 약정기간</label>
                <div class="input-unit">
                    <input type="number" id="totalMonths" placeholder="예: 12">
                    <span>개월</span>
                </div>
            </div>

            <div class="input-group">
                <label for="elapsedMonths">현재까지 납입한 개월</label>
                <div class="input-unit">
                    <input type="number" id="elapsedMonths" placeholder="예: 7">
                    <span>개월</span>
                </div>
            </div>

            <div class="input-group">
                <label for="earlyTerminationRate">중도해지 적용 예상 금리</label>
                <div class="input-unit">
                    <input type="number" id="earlyTerminationRate" step="0.01" placeholder="예: 2.0">
                    <span>%</span>
                </div>
            </div>

            <div class="input-group">
                <label for="newRate">새 적금 금리</label>
                <div class="input-unit">
                    <input type="number" id="newRate" step="0.01" placeholder="예: 5.0">
                    <span>%</span>
                </div>
            </div>

            <div class="input-group">
                <label for="newMonths">새 적금 가입기간</label>
                <div class="input-unit">
                    <input type="number" id="newMonths" placeholder="예: 12">
                    <span>개월</span>
                </div>
            </div>

            <button type="button" class="calculate-button" onclick="calculateSavingsSwitch()">계산하기</button>
        </div>

        <div class="calculator-result" id="resultBox">
            <div class="result-empty">값을 입력하고 계산하기를 눌러주세요.</div>
        </div>
    </section>
</main>
<div id="footer"></div>
<script src="../js/savings-switch.js"></script>
<script src="../js/common.js"></script>
</body>
</html>
